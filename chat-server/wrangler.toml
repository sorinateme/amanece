name = "amanecer-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Modelo de Claude. Opciones (precio por millón de tokens entrada/salida):
#   claude-haiku-4-5   -> $1 / $5   (el más barato)
#   claude-sonnet-5-5  -> $2 / $10
#   claude-opus-5-5    -> $4 / $20  (el más capaz)
MODEL = "claude-opus-5-5"
# Dominios autorizados a usar el chat, separados por coma. CAMBIA TU-DOMINIO por el de la página.
# capacitor://localhost y https://localhost son los orígenes de la app móvil (iOS/Android).
ALLOWED_ORIGINS = "https://TU-DOMINIO.org,https://www.TU-DOMINIO.org,capacitor://localhost,https://localhost,http://localhost:8080"

# La clave de API NO va aquí. Se configura como secreto:
#   npx wrangler secret put ANTHROPIC_API_KEY
